# Gitleaks configuration
# Scans for leaked secrets, API keys, passwords, tokens, and .env file commits

title = "Gitleaks configuration"

[extend]
useDefault = true

[allowlist]
  description = "Global allowlist"
  paths = [
    '''node_modules''',
    '''dist''',
    '''.venv''',
    '''__pycache__''',
    '''.*\.lock$''',
    '''pnpm-lock.yaml$''',
    '''uv.lock$''',
    '''\.env\.example$'''
  ]

[[rules]]
  id = "generic-api-key"
  description = "Generic API key"
  regex = '''(?i)(api[_-]?key|apikey)[\s]*[=:][\s]*['"]?([a-zA-Z0-9_\-]{20,})['"]?'''
  tags = ["key", "generic"]

[[rules]]
  id = "generic-secret"
  description = "Generic secret"
  regex = '''(?i)(secret|secret[_-]?key)[\s]*[=:][\s]*['"]?([a-zA-Z0-9_\-]{20,})['"]?'''
  tags = ["secret", "generic"]

[[rules]]
  id = "password-in-env"
  description = "Password in environment variable"
  regex = '''(?i)(password|passwd|pwd)[\s]*[=:][\s]*['"]?([^\s'"]{8,})['"]?'''
  tags = ["password"]

[[rules]]
  id = "aws-access-key"
  description = "AWS Access Key"
  regex = '''(?:^|[^A-Za-z0-9/+=])(?:AKIA|ABIA|ACCA|ASIA)[0-9A-Z]{16}(?:$|[^A-Za-z0-9/+=])'''
  tags = ["key", "aws"]

[[rules]]
  id = "aws-secret-key"
  description = "AWS Secret Access Key"
  regex = '''(?i)(aws[_-]?secret[_-]?access[_-]?key)[\s]*[=:][\s]*['"]?([a-zA-Z0-9/+=]{40})['"]?'''
  tags = ["secret", "aws"]

[[rules]]
  id = "github-token"
  description = "GitHub Token"
  regex = '''ghp_[a-zA-Z0-9]{36}'''
  tags = ["token", "github"]

[[rules]]
  id = "private-key"
  description = "Private Key"
  regex = '''-----BEGIN (?:RSA |EC |DSA )?PRIVATE KEY-----'''
  tags = ["key", "private"]

[[rules]]
  id = "connection-string"
  description = "Database connection string"
  regex = '''(?i)(mongodb|postgres|mysql|redis|amqp)://[^\s'"]{10,}'''
  tags = ["connection", "database"]
